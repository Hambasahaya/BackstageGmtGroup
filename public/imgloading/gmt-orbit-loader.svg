<svg width="720" height="120" viewBox="0 0 720 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GMT loading animation</title>
  <desc id="desc">A row of teal spheres moving from left to right with a subtle 3D depth effect.</desc>
  <style>
    .sphere {
      animation: travel 1.8s cubic-bezier(.45,0,.2,1) infinite;
      transform-box: fill-box;
      transform-origin: center;
      filter: drop-shadow(0 18px 18px rgba(0, 66, 59, .18));
    }

    .sphere-1 { animation-delay: 0s; opacity: .25; }
    .sphere-2 { animation-delay: .15s; opacity: .45; }
    .sphere-3 { animation-delay: .3s; opacity: .7; }
    .sphere-4 { animation-delay: .45s; opacity: .95; }
    .sphere-5 { animation-delay: .6s; opacity: .95; }
    .sphere-6 { animation-delay: .75s; opacity: .7; }
    .sphere-7 { animation-delay: .9s; opacity: .45; }
    .sphere-8 { animation-delay: 1.05s; opacity: .25; }

    @keyframes travel {
      0% {
        transform: translate3d(-74px, 0, 0) scale(.42);
        opacity: .18;
      }
      18% {
        transform: translate3d(-42px, 0, 0) scale(.68);
        opacity: .45;
      }
      42% {
        transform: translate3d(-10px, 0, 0) scale(1);
        opacity: .95;
      }
      58% {
        transform: translate3d(10px, 0, 0) scale(1);
        opacity: .95;
      }
      82% {
        transform: translate3d(42px, 0, 0) scale(.68);
        opacity: .45;
      }
      100% {
        transform: translate3d(74px, 0, 0) scale(.42);
        opacity: .18;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sphere {
        animation: none;
      }
    }
  </style>
  <defs>
    <radialGradient id="gloss" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(28 26) rotate(47) scale(88)">
      <stop stop-color="#D9F1EE"/>
      <stop offset=".38" stop-color="#58B7AD"/>
      <stop offset="1" stop-color="#00423B"/>
    </radialGradient>
    <linearGradient id="shade" x1="68" y1="0" x2="10" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00423B" stop-opacity=".9"/>
      <stop offset=".42" stop-color="#0F766E" stop-opacity=".18"/>
      <stop offset="1" stop-color="#B9D5D2" stop-opacity=".35"/>
    </linearGradient>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <g transform="translate(0 6)">
    <circle class="sphere sphere-1" cx="48" cy="54" r="26" fill="url(#gloss)" filter="url(#soft-blur)"/>
    <circle class="sphere sphere-2" cx="132" cy="54" r="34" fill="url(#gloss)"/>
    <circle class="sphere sphere-3" cx="230" cy="54" r="45" fill="url(#gloss)"/>
    <circle class="sphere sphere-4" cx="342" cy="54" r="58" fill="url(#gloss)"/>
    <circle class="sphere sphere-5" cx="464" cy="54" r="58" fill="url(#gloss)"/>
    <circle class="sphere sphere-6" cx="576" cy="54" r="45" fill="url(#gloss)"/>
    <circle class="sphere sphere-7" cx="674" cy="54" r="34" fill="url(#gloss)"/>
    <circle class="sphere sphere-8" cx="744" cy="54" r="26" fill="url(#gloss)" filter="url(#soft-blur)"/>
  </g>
  <g opacity=".28" style="mix-blend-mode:multiply">
    <circle cx="342" cy="60" r="58" fill="url(#shade)"/>
    <circle cx="464" cy="60" r="58" fill="url(#shade)"/>
  </g>
</svg>
